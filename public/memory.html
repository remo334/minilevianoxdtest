<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🃏 Memory Match</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}html,body{margin:0;height:100%;background:#0b0f1a;color:#e8ecff;font-family:system-ui,sans-serif}body{display:flex;justify-content:center}#app{width:100%;max-width:440px;height:100%;padding:12px;display:flex;flex-direction:column;gap:10px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}.b{border:1px solid #2a3560;border-radius:12px;padding:6px 14px;background:#111830;color:#ffd75e;font-weight:700}button.big{padding:10px 26px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:#6c8cff;color:#fff}#msg{text-align:center;min-height:24px}
#g{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:center}
.c{aspect-ratio:1;border:0;border-radius:14px;font-size:34px;background:#1a2550;color:transparent;transition:.2s}
.c.o{background:#2c3d85;color:#fff}.c.d{background:#1f6f45;color:#fff}</style></head><body><div id="app"><header><h1>🃏 MEMORY MATCH</h1><div class="b" id="sc">0 moves</div></header><div id="g"></div><div id="msg">Find all the pairs</div><button class="big" id="r">NEW GAME</button></div>
<script>
const E=['🐶','🐱','🦊','🐼','🐸','🦁','🐵','🐙'];let best=0;try{best=+localStorage.getItem('memBest')||0}catch(e){}
let a,b,lock,moves,found;const g=document.getElementById('g');
function ui(){document.getElementById('sc').textContent=moves+' moves · best '+(best||'-')}
function start(){const d=[...E,...E].sort(()=>Math.random()-.5);g.innerHTML='';a=b=null;lock=false;moves=0;found=0;ui();document.getElementById('msg').textContent='Find all the pairs';
 d.forEach(e=>{const c=document.createElement('button');c.className='c';c.textContent=e;c.onclick=()=>pick(c);g.appendChild(c)})}
function pick(c){if(lock||c===a||c.classList.contains('d'))return;c.classList.add('o');
 if(!a){a=c;return}b=c;moves++;ui();lock=true;
 if(a.textContent===b.textContent){a.className=b.className='c d';a=b=null;lock=false;
  if(++found===8){if(!best||moves<best){best=moves;try{localStorage.setItem('memBest',best)}catch(e){}}ui();document.getElementById('msg').textContent='🎉 Done in '+moves+' moves!'}}
 else setTimeout(()=>{a.classList.remove('o');b.classList.remove('o');a=b=null;lock=false},700)}
document.getElementById('r').onclick=start;start();
</script></body></html>
