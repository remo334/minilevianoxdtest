<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🚀 Galaxy Chat</title>
<meta property="og:title" content="🚀 GALAXY CHAT">
<meta property="og:description" content="Auto-fire · boss every 500 · grab upgrades!">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#03040c;color:#e8f1ff;font-family:system-ui,sans-serif}
body{display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:12px;gap:10px}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px;letter-spacing:1px}
.sub{font-size:10px;letter-spacing:3px;color:#5d7ab8;margin-top:2px}
.best{border:1px solid #2a3558;border-radius:12px;padding:6px 14px;text-align:center;background:#0a1020}
.best small{display:block;font-size:9px;letter-spacing:2px;color:#7c8fc0}
.best b{font-size:20px;color:#ffd75e}
#wrap{flex:1;min-height:0;position:relative;border:2px solid #1d4a63;border-radius:22px;overflow:hidden;background:#02030a}
canvas{width:100%;height:100%;display:block}
#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,3,10,.78);text-align:center;gap:6px}
#over h2{margin:0;font-size:28px}
#over p{margin:0;color:#9db2e6}
#over button{margin-top:12px;padding:12px 30px;font-size:16px;font-weight:700;border:0;border-radius:14px;background:#2bb5ff;color:#02101c}
.ctrl{display:flex;gap:12px}
.ctrl button{flex:1;height:64px;font-size:28px;color:#3fd0ff;background:#0b1830;border:2px solid #1d4a63;border-radius:20px}
.ctrl button:active{background:#12305a}
.hint{text-align:center;font-size:11px;color:#6f86c4}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>🚀 GALAXY CHAT</h1><div class="sub">AUTO-FIRE · BOSS RUSH · UPGRADES</div></div>
    <div class="best"><small>BEST</small><b id="best">0</b></div>
  </header>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="over"><h2>🚀 Ready?</h2><p>Drag, use ◀ ▶ or arrow keys</p><button id="go">START</button></div>
  </div>
  <div class="ctrl"><button id="L">◀</button><button id="R">▶</button></div>
  <div class="hint">◀ ▶ move · auto-fire · grab 🔥 ⚡ 🛡️ ➕ drops</div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=560;let DPR=1;
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);cv.width=r.width*DPR;cv.height=r.height*DPR}
addEventListener('resize',fit);fit();
let best=0;try{best=+localStorage.getItem('galaxyBest')||0}catch(e){}
const bestEl=document.getElementById('best');bestEl.textContent=best;
const over=document.getElementById('over');
const rnd=(a,b)=>a+Math.random()*(b-a);
const stars=Array.from({length:60},()=>({x:rnd(0,W),y:rnd(0,H),s:rnd(.5,2),v:rnd(10,50)}));
let S,running=false,last=0,keys={L:false,R:false},dragX=null;

function reset(){
  S={ship:{x:W/2,y:H-48,w:26},bul:[],en:[],eb:[],it:[],score:0,t:0,spawn:0,fire:0,
     nextBoss:500,boss:null,rapid:0,speed:0,shield:false,multi:1,fx:[]};
}
function start(){reset();running=true;over.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function end(){
  running=false;
  if(S.score>best){best=S.score;try{localStorage.setItem('galaxyBest',best)}catch(e){}bestEl.textContent=best}
  over.innerHTML='<h2>💥 Game Over</h2><p>Score '+S.score+' · Best '+best+'</p><button id="go">PLAY AGAIN</button>';
  over.style.display='flex';document.getElementById('go').onclick=start;
}
document.getElementById('go').onclick=start;

function boom(x,y,c,n=10){for(let i=0;i<n;i++)S.fx.push({x,y,vx:rnd(-90,90),vy:rnd(-90,90),l:.5,c})}

function update(dt){
  S.t+=dt;const sh=S.ship;
  const sp=(S.speed>0?340:230);
  if(keys.L)sh.x-=sp*dt;if(keys.R)sh.x+=sp*dt;
  if(dragX!==null){const d=dragX-sh.x;sh.x+=Math.sign(d)*Math.min(Math.abs(d),sp*1.6*dt)}
  sh.x=Math.max(sh.w/2,Math.min(W-sh.w/2,sh.x));
  S.rapid=Math.max(0,S.rapid-dt);S.speed=Math.max(0,S.speed-dt);
  // auto fire
  S.fire-=dt;
  if(S.fire<=0){
    S.fire=S.rapid>0?.12:.26;
    const n=S.multi,gap=10;
    for(let i=0;i<n;i++)S.bul.push({x:sh.x+(i-(n-1)/2)*gap,y:sh.y-18,v:-520});
  }
  // spawns
  const lvl=1+S.score/250;
  if(!S.boss){
    S.spawn-=dt;
    if(S.spawn<=0){S.spawn=Math.max(.35,1-S.score/1200);
      S.en.push({x:rnd(20,W-20),y:-20,v:rnd(55,85)+lvl*8,hp:1+(S.score>300?1:0),ph:rnd(0,6),amp:rnd(0,40)})}
    if(S.score>=S.nextBoss){
      S.boss={x:W/2,y:-60,hp:30+S.nextBoss/25,max:30+S.nextBoss/25,dir:1,sh:1.2};S.nextBoss+=500;
    }
  }
  const B=S.boss;
  if(B){
    if(B.y<70)B.y+=60*dt;else{B.x+=B.dir*90*dt;if(B.x>W-45){B.dir=-1}if(B.x<45){B.dir=1}}
    B.sh-=dt;
    if(B.sh<=0&&B.y>=70){B.sh=1.1;for(const a of[-60,0,60])S.eb.push({x:B.x,y:B.y+30,vx:a,vy:190})}
  }
  // move
  for(const b of S.bul)b.y+=b.v*dt;S.bul=S.bul.filter(b=>b.y>-20);
  for(const e of S.en){e.y+=e.v*dt;e.x+=Math.sin(S.t*2+e.ph)*e.amp*dt}
  for(const b of S.eb){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const i of S.it)i.y+=90*dt;
  for(const f of S.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt}S.fx=S.fx.filter(f=>f.l>0);
  // bullets vs enemies
  for(const b of S.bul){
    for(const e of S.en){
      if(!b.dead&&e.hp>0&&Math.abs(b.x-e.x)<15&&Math.abs(b.y-e.y)<15){b.dead=1;e.hp--;
        if(e.hp<=0){S.score+=10;boom(e.x,e.y,'#5dff9a');
          if(Math.random()<.16)S.it.push({x:e.x,y:e.y,k:['🔥','⚡','🛡️','➕'][Math.floor(Math.random()*4)]})}}
    }
    if(B&&!b.dead&&Math.abs(b.x-B.x)<44&&Math.abs(b.y-B.y)<32){b.dead=1;B.hp--;boom(b.x,b.y,'#ffd75e',3);
      if(B.hp<=0){S.score+=100;boom(B.x,B.y,'#ff6a6a',40);S.it.push({x:B.x,y:B.y,k:'➕'},{x:B.x-30,y:B.y,k:'🛡️'});S.boss=null}}
  }
  S.bul=S.bul.filter(b=>!b.dead);S.en=S.en.filter(e=>e.hp>0&&e.y<H+30);
  // hits on ship
  const hit=(x,y,r)=>Math.abs(x-sh.x)<r&&Math.abs(y-sh.y)<r+4;
  let dead=false;
  for(const e of S.en)if(e.hp>0&&hit(e.x,e.y,18)){e.hp=0;boom(e.x,e.y,'#5dff9a');if(S.shield)S.shield=false;else dead=true}
  for(const b of S.eb)if(!b.d&&hit(b.x,b.y,10)){b.d=1;if(S.shield)S.shield=false;else dead=true}
  S.eb=S.eb.filter(b=>!b.d&&b.y<H+20&&b.x>-20&&b.x<W+20);
  for(const i of S.it)if(hit(i.x,i.y,20)){i.got=1;
    if(i.k==='🔥')S.rapid=9;else if(i.k==='⚡')S.speed=9;else if(i.k==='🛡️')S.shield=true;else S.multi=Math.min(3,S.multi+1);S.score+=5}
  S.it=S.it.filter(i=>!i.got&&i.y<H+20);
  if(dead){boom(sh.x,sh.y,'#3fd0ff',30);end()}
}

function draw(){
  const k=cv.width/W;ctx.setTransform(k,0,0,cv.height/H,0,0);
  ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=s.s/2.4;ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;
  if(!S)return;
  ctx.fillStyle='#fff';for(const b of S.bul)ctx.fillRect(b.x-2,b.y-8,4,14);
  ctx.fillStyle='#ff5d8a';for(const b of S.eb){ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill()}
  for(const e of S.en){ctx.fillStyle='#4be07f';ctx.beginPath();ctx.moveTo(e.x-15,e.y-12);ctx.lineTo(e.x,e.y-4);ctx.lineTo(e.x+15,e.y-12);ctx.lineTo(e.x,e.y+14);ctx.closePath();ctx.fill()}
  const B=S.boss;
  if(B){ctx.fillStyle='#ff4b6e';ctx.beginPath();ctx.moveTo(B.x-44,B.y-22);ctx.lineTo(B.x,B.y-6);ctx.lineTo(B.x+44,B.y-22);ctx.lineTo(B.x+26,B.y+8);ctx.lineTo(B.x,B.y+30);ctx.lineTo(B.x-26,B.y+8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#331018';ctx.fillRect(B.x-44,B.y-40,88,6);ctx.fillStyle='#ffd75e';ctx.fillRect(B.x-44,B.y-40,88*B.hp/B.max,6)}
  ctx.font='20px serif';ctx.textAlign='center';for(const i of S.it)ctx.fillText(i.k,i.x,i.y+7);
  for(const f of S.fx){ctx.globalAlpha=Math.max(0,f.l*2);ctx.fillStyle=f.c;ctx.fillRect(f.x,f.y,3,3)}ctx.globalAlpha=1;
  const s=S.ship;
  if(running){
    ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.moveTo(s.x-4,s.y+14);ctx.lineTo(s.x,s.y+14+8+Math.random()*6);ctx.lineTo(s.x+4,s.y+14);ctx.fill();
    ctx.fillStyle='#35b6ff';ctx.beginPath();ctx.moveTo(s.x,s.y-18);ctx.lineTo(s.x+14,s.y+14);ctx.lineTo(s.x,s.y+8);ctx.lineTo(s.x-14,s.y+14);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd75e';ctx.fillRect(s.x-2,s.y-2,4,10);
    if(S.shield){ctx.strokeStyle='rgba(120,200,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,24,0,7);ctx.stroke()}
  }
  ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='left';ctx.fillText('SCORE '+S.score,12,H-14);
  ctx.textAlign='right';
  let p=(S.rapid>0?'🔥':'')+(S.speed>0?'⚡':'')+(S.shield?'🛡️':'')+(S.multi>1?'➕'+S.multi:'');
  ctx.fillText('PWR '+(p||'★'),W-12,H-14);
  if(B&&running){ctx.textAlign='center';ctx.fillStyle='#ff6a8a';ctx.fillText('⚠ BOSS',W/2,22)}
}
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=rnd(0,W)}}
  if(running)update(dt);
  draw();
  if(running)requestAnimationFrame(loop);
}
reset();draw();

// input
const hold=(id,k)=>{const el=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[k]=true;dragX=null},off=e=>{e.preventDefault();keys[k]=false};
  el.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,off))};
hold('L','L');hold('R','R');
const wrap=document.getElementById('wrap');
const toX=e=>{const r=wrap.getBoundingClientRect();return(e.clientX-r.left)/r.width*W};
wrap.addEventListener('pointerdown',e=>{if(running)dragX=toX(e)});
wrap.addEventListener('pointermove',e=>{if(dragX!==null)dragX=toX(e)});
['pointerup','pointercancel'].forEach(t=>wrap.addEventListener(t,()=>dragX=null));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.L=true;if(e.key==='ArrowRight'||e.key==='d')keys.R=true;
  if((e.key===' '||e.key==='Enter')&&!running)start()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.L=false;if(e.key==='ArrowRight'||e.key==='d')keys.R=false});
requestAnimationFrame(function idle(t){if(!running){last=t;draw();requestAnimationFrame(idle)}});
})();
</script>
</body>
</html>
